<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xml:lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>HBD ANJU</title>
    <link type="text/css" rel="stylesheet" href="./file/default.css">
    <script type="text/javascript" src="./file/jquery.min.js"></script>
    <script type="text/javascript" src="./file/jscex.min.js"></script>
    <script type="text/javascript" src="./file/jscex-parser.js"></script>
    <script type="text/javascript" src="./file/jscex-jit.js"></script>
    <script type="text/javascript" src="./file/jscex-builderbase.min.js"></script>
    <script type="text/javascript" src="./file/jscex-async.min.js"></script>
    <script type="text/javascript" src="./file/jscex-async-powerpack.min.js"></script>
    <script type="text/javascript" src="./file/functions.js" charset="utf-8"></script>
    <script type="text/javascript" src="./file/love.js" charset="utf-8"></script>
    <style>
        /* Mobile adjustment */
        @media only screen and (max-width: 768px) {
            body { margin: 0; padding: 0; overflow: hidden; }
            #main { width: 100% !important; height: 100% !important; margin: 0 !important; }
            #wrap { width: 100% !important; height: 100% !important; margin: 0 !important; position: relative !important; }
            #text { 
                width: 90% !important; 
                left: 5% !important; 
                top: 50px !important; 
                font-size: 16px !important; 
                position: absolute !important;
                z-index: 999;
            }
            #canvas { 
                width: 100% !important; 
                height: 100% !important; 
                display: block !important;
            }
            #clock-box { 
                position: absolute !important; 
                bottom: 20px !important; 
                width: 100% !important; 
                text-align: center !important;
                left: 0 !important;
                font-size: 14px !important;
            }
        }
    </style>
    <script>
        function playAudio() {
            var audio = document.getElementById("myAudio");
            if (audio) audio.play();
        }
    </script>
</head>
<body>
    <div id="main">
        <audio autoplay="autoplay" id="myAudio">
            <source src="aud.mp3" type="audio/mp3" />
        </audio>
        <div id="wrap">
            <div id="text">
                <div id="code">
                    <span class="say">Happiest Birthday Anju 🍰🎈</span><br>
                    <span class="say">May you have a</span><br>
                    <span class="say">Wonderful year, and </span><br>
                    <span class="say">May all your wishes</span><br>
                    <span class="say">Come true! 😇❤️</span><br>
                    <span class="say">Hope u have a great day today 💕</span><br>
                </div>
            </div>
            <div id="clock-box">
                <span id="clock"></span>
            </div>
            <canvas id="canvas"></canvas>
        </div>
    </div>

    <script>
    (function() {
        var canvas = $('#canvas');
        if (!canvas[0].getContext) { return; }

        var width = $(window).width();
        var height = $(window).height();
        canvas.attr("width", width);
        canvas.attr("height", height);

        var opts = {
            seed: { x: width / 2, color: "rgb(190, 26, 37)", scale: (width < 600 ? 1.5 : 2) },
            branch: [[width/2, height, width/2, height/2, width/2-100, height/3, 30, 100, []]],
            bloom: { num: 700, width: width, height: height },
            footer: { width: width, height: 5, speed: 10 }
        }

        var tree = new Tree(canvas[0], width, height, opts);
        var seed = tree.seed;
        var hold = 1;

        canvas.click(function(e) {
            playAudio();
            var offset = canvas.offset(), x = e.pageX - offset.left, y = e.pageY - offset.top;
            if (seed.hover(x, y)) { hold = 0; canvas.unbind("click"); }
        });

        var runAsync = eval(Jscex.compile("async", function () {
            seed.draw();
            while (hold) { $await(Jscex.Async.sleep(10)); }
            while (seed.canScale()) { seed.scale(0.95); $await(Jscex.Async.sleep(10)); }
            while (seed.canMove()) { seed.move(0, 2); tree.footer.draw(); $await(Jscex.Async.sleep(10)); }
            do { tree.grow(); $await(Jscex.Async.sleep(10)); } while (tree.canGrow());
            do { tree.flower(2); $await(Jscex.Async.sleep(10)); } while (tree.canFlower());
            $("#code").show().typewriter();
        }));

        runAsync().start();
    })();
    </script>
</body>
</html>
